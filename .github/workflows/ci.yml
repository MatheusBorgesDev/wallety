name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Local-only credentials for the CI database; nothing here is a secret.
  DATABASE_URL: postgresql://wallety:wallety@localhost:5433/wallety_test?schema=public
  TEST_DATABASE_URL: postgresql://wallety:wallety@localhost:5433/wallety_test?schema=public

defaults:
  run:
    working-directory: api

jobs:
  lint-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run generate
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run generate
      - run: npm run test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wallety
          POSTGRES_PASSWORD: wallety
          POSTGRES_DB: wallety_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U wallety -d wallety_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run generate
      - run: npm run test:integration

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image and start database, migrations, API and delivery process
        run: docker compose up -d --build
      - name: Wait for the API
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/health/live; then exit 0; fi
            sleep 1
          done
          docker compose logs
          exit 1
      - name: Health check reaches the database
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/health)
          echo "GET /health -> $status"
          test "$status" = "200"
      - name: Register, transfer twice with one key, and see the event delivered after a simulated failure
        # Through the public API only, with the API on its restricted database login.
        run: docker compose run --rm --no-deps -e SMOKE_BASE_URL=http://api:3000 -e SMOKE_PURGE_SECRET=local-only-cleanup-secret-not-a-secret-000 api dist/smoke/api-smoke.js
      - name: Image runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint /nodejs/bin/node wallety-api:local -e "console.log(process.getuid())")
          echo "uid=$uid"
          test "$uid" != "0"
      - name: Record the image size
        run: |
          reported=$(docker image inspect wallety-api:local --format '{{.Size}}')
          compressed=$(docker save wallety-api:local | gzip -c | wc -c)
          {
            echo "Image size reported by docker image inspect: $reported bytes"
            echo "Image size as a gzip-compressed archive (docker save | gzip): $compressed bytes"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to production
    # Runs only for pushes to main, only after every check above passed, and only once the
    # Google Cloud project is configured (see infra/gcp-setup.sh).
    needs: [lint-typecheck, unit, integration, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # exchanges the GitHub OIDC token for short-lived Google credentials; no stored key
    defaults:
      run:
        working-directory: .
    env:
      SERVICE: wallety-api
      DB_SECRET: wallety-database-url
      MIGRATION_DB_SECRET: wallety-migration-database-url
      WORKER_SERVICE: wallety-worker
      DISPATCH_DB_SECRET: wallety-dispatch-database-url
      SIGNING_SECRET: wallety-webhook-signing-secret
      JWT_SECRET_NAME: wallety-jwt-secret
      PURGE_DB_SECRET: wallety-purge-database-url
      PURGE_SECRET_NAME: wallety-purge-secret
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wallety/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Build and push the image
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" api
          docker push "$IMAGE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Apply database migrations
        working-directory: api
        run: |
          npm ci
          database_url="$(gcloud secrets versions access latest --secret="$MIGRATION_DB_SECRET" --project="${{ vars.GCP_PROJECT_ID }}")"
          echo "::add-mask::$database_url"
          DATABASE_URL="$database_url" npx prisma migrate deploy
      - name: Release the new revision
        run: |
          gcloud run deploy "$SERVICE" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --image="$IMAGE" \
            --service-account="${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --update-secrets="DATABASE_URL=${DB_SECRET}:latest,WEBHOOK_SIGNING_SECRET=${SIGNING_SECRET}:latest,JWT_SECRET=${JWT_SECRET_NAME}:latest,PURGE_DATABASE_URL=${PURGE_DB_SECRET}:latest,PURGE_SECRET=${PURGE_SECRET_NAME}:latest" \
            --update-env-vars="TRUST_PROXY=1" \
            --max-instances=2 \
            --memory=512Mi \
            --cpu=1 \
            --quiet
      - name: Release the delivery process
        # Same image, another entry point, its own identity and database login. Not public.
        run: |
          api_url="$(gcloud run services describe "$SERVICE" --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" --format='value(status.url)')"
          gcloud run deploy "$WORKER_SERVICE" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --image="$IMAGE" \
            --args="dist/worker.js" \
            --service-account="${{ vars.GCP_WORKER_SERVICE_ACCOUNT }}" \
            --update-secrets="DATABASE_URL=${DISPATCH_DB_SECRET}:latest,WEBHOOK_SIGNING_SECRET=${SIGNING_SECRET}:latest" \
            --set-env-vars="WEBHOOK_TARGET_URL=${api_url}/webhooks/receiver" \
            --no-allow-unauthenticated \
            --max-instances=1 \
            --memory=512Mi \
            --cpu=1 \
            --quiet
      - name: Point the API at the delivery process
        # The API tells the delivery process about each posted transfer. The address only
        # exists after the first release of that service, so it is set here and kept afterwards.
        run: |
          worker_url="$(gcloud run services describe "$WORKER_SERVICE" --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" --format='value(status.url)')"
          current="$(gcloud run services describe "$SERVICE" --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" --format=json | jq -r '.spec.template.spec.containers[0].env[]? | select(.name == "DISPATCH_URL") | .value')"
          if [ "$current" != "$worker_url" ]; then
            gcloud run services update "$SERVICE" \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --region="${{ vars.GCP_REGION }}" \
              --update-env-vars="DISPATCH_URL=${worker_url},DISPATCH_AUTH=google-id-token" \
              --quiet
          fi
      - name: Smoke test in production
        run: |
          url="$(gcloud run services describe "$SERVICE" --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" --format='value(status.url)')"
          for attempt in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url/health" || true)
            echo "attempt $attempt: GET /health -> $status"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 5
          done
          exit 1
