name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Local-only credentials for the CI database; nothing here is a secret.
  DATABASE_URL: postgresql://wallety:wallety@localhost:5433/wallety_test?schema=public
  TEST_DATABASE_URL: postgresql://wallety:wallety@localhost:5433/wallety_test?schema=public

defaults:
  run:
    working-directory: api

jobs:
  lint-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run generate
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run generate
      - run: npm run test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wallety
          POSTGRES_PASSWORD: wallety
          POSTGRES_DB: wallety_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U wallety -d wallety_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run generate
      - run: npm run test:integration
