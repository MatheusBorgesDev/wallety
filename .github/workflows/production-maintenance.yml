name: Production maintenance

# Hourly: removes expired sandboxes and asks the delivery process to sweep the outbox for
# events that a notification missed. Spaced out on purpose, so a scale-to-zero database is
# not kept awake all month.
on:
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # exchanges the GitHub OIDC token for short-lived Google credentials; no stored key

concurrency:
  group: production-maintenance
  cancel-in-progress: false

env:
  SERVICE: wallety-api
  WORKER_SERVICE: wallety-worker
  PURGE_SECRET_NAME: wallety-purge-secret

jobs:
  cleanup:
    name: Remove expired sandboxes
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: POST /internal/purge
        run: |
          url="$(gcloud run services describe "$SERVICE" --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" --format='value(status.url)')"
          secret="$(gcloud secrets versions access latest --secret="$PURGE_SECRET_NAME" --project="${{ vars.GCP_PROJECT_ID }}")"
          echo "::add-mask::$secret"
          curl --fail-with-body -sS --max-time 120 -X POST -H "Authorization: Bearer $secret" "$url/internal/purge"

  sweep:
    name: Sweep the outbox
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: POST /internal/dispatch on the private delivery process
        run: |
          url="$(gcloud run services describe "$WORKER_SERVICE" --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" --format='value(status.url)')"
          # The service is private: it only accepts an identity token minted for it.
          token="$(gcloud auth print-identity-token --impersonate-service-account="${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}" --audiences="$url")"
          echo "::add-mask::$token"
          curl --fail-with-body -sS --max-time 120 -X POST -H "Authorization: Bearer $token" "$url/internal/dispatch"
