# `docker compose up` brings up the database, applies the migrations and starts the API
# and the webhook delivery process.
# For local development with `npm run dev`, start only the database: `docker compose up -d postgres`.
# The credentials below are local-only defaults, not secrets.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wallety
      POSTGRES_PASSWORD: wallety
      POSTGRES_DB: wallety
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallety -d wallety"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./api
      target: build
    # Apply the migrations as the database owner, then create the local login role of the API.
    command:
      - sh
      - -c
      - npx prisma migrate deploy && npx prisma db execute --file prisma/local/login-roles.sql
    environment:
      DATABASE_URL: postgresql://wallety:wallety@postgres:5432/wallety?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: wallety-api:local
    build:
      context: ./api
    environment:
      # The API connects with a role that cannot update or delete ledger rows.
      DATABASE_URL: postgresql://wallety_api:wallety_api@postgres:5432/wallety?schema=public
      PORT: "3000"
      WEBHOOK_SIGNING_SECRET: local-only-webhook-signing-secret-not-a-secret
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The webhook delivery process: same image, its own entry point and database login.
  worker:
    image: wallety-api:local
    command: ["dist/worker.js"]
    environment:
      # A role that can read the outbox and update delivery state, and nothing else.
      DATABASE_URL: postgresql://wallety_dispatcher:wallety_dispatcher@postgres:5432/wallety?schema=public
      PORT: "3001"
      WEBHOOK_SIGNING_SECRET: local-only-webhook-signing-secret-not-a-secret
      WEBHOOK_TARGET_URL: http://api:3000/webhooks/receiver
      WORKER_POLL_INTERVAL_MS: "1000"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
